# Décisions humaines du contrôle exhaustif des noms (python -m src.data.audit_names)
#
# Chaque candidat listé dans data/interim/audit/revue_audit_noms.md reçoit UNE décision :
#   - c'est un nom          -> l'ajouter au lexique (configs/prenoms_fr.txt ou prenoms_en.txt)
#                              ou à liste_noire (configs/anonymisation.yaml) ; il sera masqué
#                              à la prochaine anonymisation
#   - ce n'est pas un nom   -> l'ajouter à non_noms ci-dessous
#   - doute                 -> l'ajouter à exclure_si_contient ci-dessous : tout exemple qui le
#                              contient est retiré de tous les jeux (tests compris) par select.py
#
# Comparaison insensible à la casse. Une entrée par ligne, entre guillemets en cas de doute
# (YAML lit On, No, Yes comme des booléens).

# Périmètre de la relecture humaine exhaustive :
#   tout              : chaque candidat attend une décision (strict, par défaut)
#   personnes_reelles : seuls bloquent les candidats des paires ChatDoctor (vrais patients) ;
#                       les cas d'examen et contenus éditoriaux (personnages fictifs) restent
#                       sous contrôle automatique. Un prénom du lexique non masqué bloque toujours.
revue_exhaustive: personnes_reelles

