# Évaluation sur les jeux de test — POC triage CHSA (python -m src.evaluation.evaluate)
# Même protocole pour chaque modèle : la comparaison se lit dans MLflow (expérience chsa-eval).
seed: 42

dataset:
  repo_id: saidmo2/chsa-triage-medical
  config: sft
  test_split: test                 # QCM (MediQAl, FrenchMedMCQA) + questions ouvertes MedQuAD
  clinique_split: eval_clinique    # cas cliniques ouverts : urgences et réanimation

modeles:
  base:
    id: Qwen/Qwen3-1.7B-Base
  sft:
    id: Qwen/Qwen3-1.7B-Base
    adaptateur: saidmo2/chsa-qwen3-1.7b-sft-lora   # fusionné au chargement (évalue ce qui est publié)
  dpo:
    id: saidmo2/chsa-qwen3-1.7b-sft                # modèle SFT fusionné (src/training/fusionner.py)
    adaptateur: saidmo2/chsa-qwen3-1.7b-sft-dpo-lora   # fusionné en bf16 : ~94 % des coefficients effacés
  dpo_separe:                                      # MODÈLE FINAL, tel qu'il sera servi (LoRA dans vLLM)
    id: saidmo2/chsa-qwen3-1.7b-sft
    adaptateur: saidmo2/chsa-qwen3-1.7b-sft-dpo-lora
    fusionner: false

# Mise en forme du prompt : la même source de vérité que l'entraînement
config_entrainement: configs/sft.yaml   # chat_template_kwargs et eos_token y sont lus

generation:
  batch_size: 32
  max_new_tokens_qcm: 64
  max_new_tokens_ouvert: 512       # au-delà, la réponse est comptée comme tronquée
  # Anti-répétition pour les questions ouvertes et la latence (pas les QCM : 64 tokens, pas de
  # boucle). Même définition dans vLLM : pénalité multiplicative sur les tokens déjà présents,
  # prompt compris. Valeur FIXÉE A PRIORI, non réglée sur le test. 1.0 = désactivée
  # (ablation greedy pur : option --repetition-penalty 1.0 en ligne de commande).
  repetition_penalty_ouvert: 1.1

latence:
  exemples: 30                     # cas cliniques traités un par un (batch de 1)
  max_new_tokens: 256

# Spécialités exclues de l'entraînement SFT (configs/selection.yaml) : sous-groupe à part
specialites_hors_entrainement: [Histology, Embryology, Cytology, Anatomy]

# Mode --smoke : nombre d'exemples par catégorie
smoke:
  qcm: 64
  medquad: 16
  clinique: 16

mlflow:
  tracking_uri: sqlite:////workspace/mlflow/mlflow.db
  experiment: chsa-eval
  artifact_location: /workspace/mlflow/artifacts

output_root: /workspace/outputs/eval
